@supports (height: 100dvh) { :root { --vvh: 100dvh; } }

html, body { background: var(--bg); }
html.lock { overflow: hidden; }
body {
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--bg);
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; }
button:active:not(:disabled) { transform: scale(.97); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; }
.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.wrap {
  width: 100%; max-width: 592px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stack { display: flex; flex-direction: column; gap: 14px; padding-block: 18px 40px; }

/* başlık alanı */
.head { padding-block: 34px 6px; }
.head .rule { display: block; width: 44px; height: 4px; border-radius: 4px; background: var(--accent); margin-bottom: 18px; }
.head h1 { font: 300 clamp(44px, 13vw, 58px)/1.05 var(--f-display); letter-spacing: .1em; text-wrap: balance; }
.head p { margin-top: 10px; color: var(--text-2); font-size: 17px; }
.pickers { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

.sel { position: relative; display: inline-block; max-width: 100%; }
.sel select {
  -webkit-appearance: none; appearance: none; height: 44px; min-width: 132px; max-width: 100%; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  font: 600 16px var(--f-body); padding: 0 38px 0 16px;
}
.sel.has-sw select { padding-left: 42px; }
.sel::after {
  content: ""; position: absolute; right: 17px; top: 50%; width: 7px; height: 7px; pointer-events: none;
  border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: translateY(-70%) rotate(45deg);
}
.sel .sw { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; border: 1px solid var(--text-3); pointer-events: none; }

/* kartlar */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.card h2 {
  font: 600 13px/1.2 var(--f-display); letter-spacing: .2em; text-transform: uppercase; color: var(--text-2); margin-bottom: 14px;
}
.card h2.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.muted { color: var(--text-2); font-size: 15px; }
.hint { color: var(--danger); font-size: 14px; margin-top: 8px; }
.pill { font: 700 11px/1 var(--f-body); letter-spacing: .04em; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 3px 8px; margin-left: 10px; vertical-align: middle; text-transform: none; }

.primary, .ghost {
  display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; padding: 0 18px;
  border-radius: 16px; font-weight: 700; font-size: 16px; letter-spacing: .02em;
}
.primary { background: var(--accent); color: var(--accent-ink); }
.primary:disabled { opacity: .4; }
.ghost { border: 1px solid var(--line); background: var(--card-2); margin-top: 14px; }

.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
.step { height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card-2); font-size: 26px; font-weight: 400; }
.year {
  width: 100%; height: 64px; text-align: center; background: transparent; color: var(--text);
  border: 1px solid var(--line); border-radius: 18px; font: 300 44px/1 var(--f-display); letter-spacing: .12em; padding: 0 0 0 .12em;
}
.chips { display: flex; gap: 8px; margin: 12px 0 14px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); font-weight: 600; font-size: 15px; }

/* ajanda listesi */
.agl { display: grid; gap: 10px; }
.ag { position: relative; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: pan-y; }
.ag-in { display: flex; align-items: stretch; background: linear-gradient(var(--card-2), var(--card-2)), var(--card); transition: transform .24s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
.ag-open { flex: 1; min-width: 0; padding: 14px 16px; text-align: left; display: grid; gap: 8px; }
.ag-year { font: 300 28px/1 var(--f-display); letter-spacing: .08em; }
.ag-meta { font-size: 14px; color: var(--text-2); }
.ag-bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; display: block; }
.ag-bar i { display: block; height: 100%; background: var(--done); }
.sync { text-align: center; color: var(--text-3); font-size: 13px; padding: 4px 8px; }

/* ajanda ekranı */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: var(--bar); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.topin { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; }
.tbtn { min-height: 44px; display: inline-flex; align-items: center; gap: 2px; font-weight: 700; color: var(--accent); justify-self: start; }
.tbtn.r { justify-self: end; }
.ttl { font: 300 20px/1 var(--f-display); letter-spacing: .22em; padding-left: .22em; }
.mhead { padding-block: 14px 0; }
.mnav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; }
.nbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); }
.nbtn:disabled { opacity: .3; }
.mname { text-align: center; }
.mname small { display: block; font: 600 12px/1 var(--f-display); letter-spacing: .3em; color: var(--text-2); margin-bottom: 4px; }
.mname h1 { font: 300 42px/1.1 var(--f-display); letter-spacing: .06em; }
.mstrip {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px));
  max-width: 100%;
}
.mstrip::-webkit-scrollbar { display: none; }
.mchip { flex: none; min-width: 58px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); font-weight: 600; font-size: 15px; padding: 0 14px; }
.mchip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.note { color: var(--text-2); font-size: 14px; margin-bottom: 10px; }
.wdr { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font: 600 12px/1 var(--f-display); letter-spacing: .06em; color: var(--text-2); margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { aspect-ratio: 1 / 1.08; min-height: 46px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
.day .n { font: 400 17px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.day.we .n { color: var(--weekend); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.day.today .n { color: var(--accent); font-weight: 700; }
.day:active:not(.blank) { background: var(--card-2); }
.day.blank { pointer-events: none; }
.dots { display: flex; gap: 3px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.alldone .dots i { background: var(--done); }
.anim-l { animation: inl .28s ease-out; }
.anim-r { animation: inr .28s ease-out; }
@keyframes vwF { from { opacity: 0; transform: translateX(34px); } to { opacity: 1; transform: none; } }
@keyframes vwB { from { opacity: 0; transform: translateX(-34px); } to { opacity: 1; transform: none; } }
@keyframes tfade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.vw-f { animation: vwF .36s cubic-bezier(.2, .75, .2, 1) both; }
.vw-b { animation: vwB .36s cubic-bezier(.2, .75, .2, 1) both; }
.tfade { animation: tfade .26s cubic-bezier(.2, .75, .2, 1) both; }
.lb { animation: askIn .22s ease both; }
@keyframes inl { from { opacity: 0; transform: translateX(26px); } }
@keyframes inr { from { opacity: 0; transform: translateX(-26px); } }

.mrow { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.mrow:first-of-type { border-top: 0; padding-top: 0; }
.mdate { display: grid; justify-items: center; align-content: start; gap: 4px; min-height: 44px; padding-top: 2px; }
.mdate b { font: 300 28px/1 var(--f-display); }
.mdate span { font-size: 12px; color: var(--text-2); }
.mit { display: flex; align-items: flex-start; min-height: 44px; }
.mit .mt { padding-top: 10px; min-width: 0; overflow-wrap: anywhere; }
.mit.done .mt { color: var(--text-3); text-decoration: line-through; }
.mit time, .sit time { color: var(--accent); font-weight: 700; font-size: 14px; margin-right: 8px; font-variant-numeric: tabular-nums; }
.check { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.check span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--text-3); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check svg { width: 16px; height: 16px; stroke: var(--done-ink); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check[aria-checked="true"] span { background: var(--done); border-color: var(--done); }
.check[aria-checked="true"] svg { opacity: 1; }
.empty { padding: 18px 4px; color: var(--text-2); text-align: center; }

/* gün sayfası */
.scrim { position: fixed; inset: env(safe-area-inset-top, 0px) 0 0 0; background: rgba(8, 10, 22, .55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 70; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 80; margin: 0 auto; max-width: 592px;
  max-height: calc(var(--vvh) - env(safe-area-inset-top, 0px) - 28px);
  display: flex; flex-direction: column;
  background: var(--sheet);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(105%); visibility: hidden;
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s .3s;
}
.sheet.on { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
.sheet:focus { outline: none; }
.grab { padding: 10px 0 2px; display: grid; place-items: center; touch-action: none; }
.grab i { width: 40px; height: 5px; border-radius: 5px; background: var(--text-3); opacity: .6; }

  function themeStripInit(root) {

        const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

      };

    /* acele etme: parmak değdiği sürece ve durduktan sonra bir süre bekle */
    /* parmak (ya da fare) basılıyken asla sorma; bırakınca kısa, ne aceleci ne uzun bir bekleme */
    let down = false; const WAIT = 550;
    const arm = () => { clearTimeout(tm); if (!down) tm = setTimeout(commit, WAIT); };
    const dn = () => { down = true; clearTimeout(tm); };
    const up = () => { down = false; if (ready) arm(); };
    /* dokunmatikte kaydırma başlayınca pointercancel gelir; bu yüzden dokunuşu yalnızca touch olaylarından izle */
    st.addEventListener('touchstart', dn, { passive: true }); st.addEventListener('touchend', up, { passive: true }); st.addEventListener('touchcancel', up, { passive: true });
    st.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') dn(); });
    st.addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse') up(); });
    st.addEventListener('pointercancel', (e) => { if (e.pointerType === 'mouse') up(); });
    st.addEventListener('scroll', () => { if (!ready) return; draw(); arm(); }, { passive: true });
    st.addEventListener('click', (e) => { const b = e.target.closest('.tc'); if (b) go(Number(b.dataset.i), true); });
    sw.addEventListener('keydown', (e) => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
      if (!d) return; e.preventDefault(); e.stopPropagation(); go(cur + d, true);
    });
  }

  const TUT = {
    en: {"t": ["Your agendas", "One page per day", "Write, tick, remember", "Keep the moment", "Quick notes", "Contacts", "Find anything", "Nothing is lost", "Everything in the menu"], "d": ["Create as many agendas as you like, each with a name and an icon, like Work or Home. Pick a year or leave it open-ended. Press and hold an agenda to edit or delete it.", "Tap a day to open its page. Swipe sideways on the month grid to change months, and use Today to jump back. Dots under a day show how many entries it has.", "Add a task, set a time or a reminder if you like, and tap its circle to tick it off. The arrow beside an entry opens a longer description. Press and hold an entry to delete it.", "Attach one photo to any entry. Photos stay on this device only. Open one and tilt your phone to tilt it in 3D, and find them all by month under Memories.", "The Notes tab is for quick thoughts: tap + and just write. The first line becomes the title. Pin the important ones, search them, or turn a note into a task on any day.", "The Contacts tab keeps people and phone numbers, each linked to a category if you wish. When a note or entry contains a phone number, the app offers to add it. It never reads your phone’s address book.", "The search box on the Agendas tab looks through every day of every agenda. Notes and Contacts have their own search.", "Deleted agendas, tasks, photos, notes and contacts wait in the Trash until you restore them or delete them forever. You can also export a backup file in Settings and import it later.", "The menu icon opens a side panel. Settings hold the theme strip, language and backup. These icons mean:"], "n": "Next", "s": "Skip", "g": "Start", "h": "Tutorial"},
    tr: {"t": ["Ajandaların", "Her güne bir sayfa", "Yaz, işaretle, hatırla", "Anı sakla", "Hızlı notlar", "Kişiler", "Her şeyi bul", "Hiçbir şey kaybolmaz", "Hepsi menüde"], "d": ["İş, Ev gibi ad ve simge verdiğin istediğin kadar ajanda oluştur. Bir yıl seç ya da yılsız bırak. Düzenlemek veya silmek için ajandaya basılı tut.", "Sayfasını açmak için bir güne dokun. Ay görünümünde yana kaydırarak ay değiştir, Bugün ile geri dön. Günün altındaki noktalar kaç girdisi olduğunu gösterir.", "Görev ekle, istersen saat ya da hatırlatma koy, tamamlamak için dairesine dokun. Girdinin yanındaki ok uzun bir açıklama alanı açar. Silmek için girdiye basılı tut.", "Her girdiye bir fotoğraf ekle. Fotoğraflar yalnızca bu cihazda durur. Birini açıp telefonu eğerek 3B eğebilirsin; hepsi ay ay Anılar’da.", "Notlar sekmesi hızlı düşünceler için: + düğmesine dokun ve yaz. İlk satır başlık olur. Önemlileri sabitle, ara ya da bir notu istediğin güne göreve çevir.", "Kişiler sekmesi kişileri ve telefon numaralarını tutar; istersen her biri bir kategoriye bağlanır. Bir not ya da girdide telefon numarası olursa uygulama eklemeyi önerir. Telefonunun rehberini okumaz.", "Ajandalar sekmesindeki arama kutusu bütün ajandaların her gününü tarar. Notlar ve Kişiler’in kendi aramaları var.", "Silinen ajanda, görev, fotoğraf, not ve kişiler sen geri yükleyene ya da kalıcı silene kadar Çöp Kutusu’nda bekler. Ayarlardan yedek dosyası dışa aktarıp sonra içe aktarabilirsin.", "Menü simgesi yan paneli açar. Ayarlarda tema şeridi, dil ve yedekleme var. Simgelerin anlamı:"], "n": "İleri", "s": "Geç", "g": "Başla", "h": "Tanıtım"},
    zh: {"t": ["你的日程本", "每天一页", "写下、勾选、记住", "留住瞬间", "快速笔记", "联系人", "找到一切", "不会丢失", "一切都在菜单里"], "d": ["随心创建日程，每个都有名称和图标，如“工作”“家庭”。可指定年份，也可不限年份。长按日程即可编辑或删除。", "点按某一天打开它的页面。在月视图中左右滑动切换月份，点“今天”快速返回。日期下方的小点表示条目数量。", "添加任务，可设置时间或提醒，点按圆圈即可勾选完成。条目旁的箭头会展开更长的描述。长按条目即可删除。", "每个条目可附一张照片。照片只保存在本设备上。打开照片后倾斜手机可看到3D倾斜效果，所有照片按月份集中在“回忆”中。", "“笔记”标签用于快速记录：点按 + 直接写。第一行即标题。可置顶重要笔记、搜索，也可把笔记转为任意一天的任务。", "“联系人”标签保存人名和电话号码，还可关联到某个类别。笔记或条目中出现电话号码时，应用会提议添加。它不会读取你手机的通讯录。", "“日程”标签里的搜索框会搜索所有日程的每一天。笔记和联系人各有自己的搜索。", "删除的日程、任务、照片、笔记和联系人会留在回收站，直到你恢复或永久删除。你也可以在设置中导出备份文件，之后再导入。", "菜单图标会打开侧边栏。设置里有主题条、语言和备份。图标含义如下："], "n": "下一步", "s": "跳过", "g": "开始", "h": "使用指南"},
    es: {"t": ["Tus agendas", "Una página por día", "Escribe, marca, recuerda", "Guarda el momento", "Notas rápidas", "Contactos", "Encuentra todo", "Nada se pierde", "Todo en el menú"], "d": ["Crea todas las agendas que quieras, cada una con nombre e icono, como Trabajo o Casa. Elige un año o déjala sin año. Mantén pulsada una agenda para editarla o borrarla.", "Toca un día para abrir su página. Desliza de lado en la cuadrícula del mes para cambiar de mes y usa Hoy para volver. Los puntos bajo un día indican cuántas entradas tiene.", "Añade una tarea, pon una hora o un recordatorio si quieres y toca su círculo para marcarla. La flecha junto a una entrada abre una descripción más larga. Mantén pulsada una entrada para borrarla.", "Adjunta una foto a cualquier entrada. Las fotos se quedan solo en este dispositivo. Abre una e inclina el teléfono para verla en 3D; todas están por meses en Recuerdos.", "La pestaña Notas es para ideas rápidas: toca + y escribe. La primera línea es el título. Fija las importantes, búscalas o convierte una nota en tarea de cualquier día.", "La pestaña Contactos guarda personas y números de teléfono, cada uno con una categoría si quieres. Si una nota o entrada contiene un número, la app te ofrece añadirlo. Nunca lee la agenda de contactos de tu teléfono.", "El buscador de la pestaña Agendas recorre todos los días de todas las agendas. Notas y Contactos tienen su propio buscador.", "Las agendas, tareas, fotos, notas y contactos borrados esperan en la Papelera hasta que los restaures o los borres para siempre. En Ajustes puedes exportar una copia de seguridad e importarla después.", "El icono del menú abre un panel lateral. En Ajustes están la tira de temas, el idioma y la copia de seguridad. Estos iconos significan:"], "n": "Siguiente", "s": "Omitir", "g": "Empezar", "h": "Tutorial"},
    fr: {"t": ["Tes agendas", "Une page par jour", "Écris, coche, souviens-toi", "Garde l’instant", "Notes rapides", "Contacts", "Trouve tout", "Rien ne se perd", "Tout est dans le menu"], "d": ["Crée autant d’agendas que tu veux, chacun avec un nom et une icône, comme Travail ou Maison. Choisis une année ou laisse-le sans année. Appuie longuement sur un agenda pour le modifier ou le supprimer.", "Touche un jour pour ouvrir sa page. Glisse sur le côté dans la grille du mois pour changer de mois et utilise Aujourd’hui pour revenir. Les points sous un jour indiquent son nombre d’entrées.", "Ajoute une tâche, mets une heure ou un rappel si tu veux, et touche son rond pour la cocher. La flèche à côté d’une entrée ouvre une description plus longue. Appuie longuement sur une entrée pour la supprimer.", "Joins une photo à n’importe quelle entrée. Les photos restent uniquement sur cet appareil. Ouvre-en une et incline le téléphone pour l’incliner en 3D ; toutes sont classées par mois dans Souvenirs.", "L’onglet Notes sert aux idées rapides : touche + et écris. La première ligne devient le titre. Épingle les importantes, cherche-les ou transforme une note en tâche pour un jour au choix.", "L’onglet Contacts garde des personnes et leurs numéros, chacun lié à une catégorie si tu veux. Quand une note ou une entrée contient un numéro, l’app propose de l’ajouter. Elle ne lit jamais le répertoire de ton téléphone.", "La recherche de l’onglet Agendas parcourt chaque jour de tous les agendas. Notes et Contacts ont leur propre recherche.", "Les agendas, tâches, photos, notes et contacts supprimés attendent dans la corbeille jusqu’à ce que tu les restaures ou les supprimes définitivement. Dans les réglages, tu peux exporter une sauvegarde et l’importer plus tard.", "L’icône du menu ouvre un panneau latéral. Les réglages contiennent la bande de thèmes, la langue et la sauvegarde. Ces icônes signifient :"], "n": "Suivant", "s": "Passer", "g": "Commencer", "h": "Tutoriel"},
    pt: {"t": ["Suas agendas", "Uma página por dia", "Escreva, marque, lembre", "Guarde o momento", "Notas rápidas", "Contatos", "Encontre tudo", "Nada se perde", "Tudo no menu"], "d": ["Crie quantas agendas quiser, cada uma com nome e ícone, como Trabalho ou Casa. Escolha um ano ou deixe sem ano. Mantenha pressionada uma agenda para editá-la ou excluí-la.", "Toque em um dia para abrir sua página. Deslize para o lado na grade do mês para trocar de mês e use Hoje para voltar. Os pontos sob um dia mostram quantas entradas ele tem.", "Adicione uma tarefa, defina horário ou lembrete se quiser e toque no círculo para concluí-la. A seta ao lado de uma entrada abre uma descrição mais longa. Mantenha pressionada uma entrada para excluí-la.", "Anexe uma foto a qualquer entrada. As fotos ficam só neste dispositivo. Abra uma e incline o celular para vê-la em 3D; todas ficam por mês em Memórias.", "A aba Notas é para ideias rápidas: toque em + e escreva. A primeira linha vira o título. Fixe as importantes, pesquise ou transforme uma nota em tarefa de qualquer dia.", "A aba Contatos guarda pessoas e números de telefone, cada um com uma categoria, se quiser. Quando uma nota ou entrada tem um número, o app oferece adicioná-lo. Ele nunca lê a agenda de contatos do seu celular.", "A busca da aba Agendas varre todos os dias de todas as agendas. Notas e Contatos têm a própria busca.", "Agendas, tarefas, fotos, notas e contatos excluídos ficam na Lixeira até você restaurá-los ou excluí-los para sempre. Em Ajustes você pode exportar um backup e importá-lo depois.", "O ícone do menu abre um painel lateral. Os ajustes têm a faixa de temas, o idioma e o backup. Estes ícones significam:"], "n": "Avançar", "s": "Pular", "g": "Começar", "h": "Tutorial"},
    ru: {"t": ["Ваши ежедневники", "Страница на каждый день", "Пишите, отмечайте, помните", "Сохраните момент", "Быстрые заметки", "Контакты", "Найдёте всё", "Ничего не пропадёт", "Всё в меню"], "d": ["Создавайте сколько угодно ежедневников с названием и значком, например «Работа» или «Дом». Выберите год или оставьте без года. Нажмите и удерживайте ежедневник, чтобы изменить или удалить его.", "Коснитесь дня, чтобы открыть его страницу. Смахивайте вбок в сетке месяца, чтобы менять месяц, а кнопка «Сегодня» вернёт назад. Точки под днём показывают число записей.", "Добавьте задачу, при желании задайте время или напоминание и коснитесь кружка, чтобы отметить её. Стрелка рядом с записью открывает подробное описание. Удерживайте запись, чтобы удалить её.", "Прикрепите одно фото к любой записи. Фото хранятся только на этом устройстве. Откройте фото и наклоняйте телефон — оно наклонится в 3D; все снимки по месяцам — в «Воспоминаниях».", "Вкладка «Заметки» — для быстрых мыслей: нажмите + и пишите. Первая строка становится заголовком. Закрепляйте важное, ищите или превращайте заметку в задачу на любой день.", "Вкладка «Контакты» хранит людей и номера телефонов, при желании с привязкой к категории. Если в заметке или записи есть номер, приложение предложит добавить его. Адресную книгу телефона оно не читает.", "Поиск на вкладке «Ежедневники» просматривает каждый день всех ежедневников. У заметок и контактов — свой поиск.", "Удалённые ежедневники, задачи, фото, заметки и контакты ждут в корзине, пока вы не восстановите их или не удалите навсегда. В настройках можно экспортировать резервную копию и позже импортировать её.", "Значок меню открывает боковую панель. В настройках — лента тем, язык и резервная копия. Значки означают:"], "n": "Далее", "s": "Пропустить", "g": "Начать", "h": "Обучение"},
    de: {"t": ["Deine Agenden", "Eine Seite pro Tag", "Schreiben, abhaken, merken", "Den Moment festhalten", "Schnelle Notizen", "Kontakte", "Alles finden", "Nichts geht verloren", "Alles im Menü"], "d": ["Lege beliebig viele Agenden mit Name und Symbol an, etwa Arbeit oder Zuhause. Wähle ein Jahr oder lass es offen. Halte eine Agenda gedrückt, um sie zu bearbeiten oder zu löschen.", "Tippe auf einen Tag, um seine Seite zu öffnen. Wische im Monatsraster zur Seite, um den Monat zu wechseln, und springe mit Heute zurück. Punkte unter einem Tag zeigen, wie viele Einträge er hat.", "Füge eine Aufgabe hinzu, setze auf Wunsch Uhrzeit oder Erinnerung und tippe auf den Kreis, um sie abzuhaken. Der Pfeil neben einem Eintrag öffnet eine längere Beschreibung. Halte einen Eintrag gedrückt, um ihn zu löschen.", "Hänge an jeden Eintrag ein Foto. Fotos bleiben nur auf diesem Gerät. Öffne eines und neige das Handy für den 3D-Effekt; alle findest du nach Monaten unter Erinnerungen.", "Der Tab Notizen ist für schnelle Gedanken: Tippe auf + und schreib los. Die erste Zeile wird zum Titel. Hefte Wichtiges an, such darin oder mach aus einer Notiz eine Aufgabe für einen beliebigen Tag.", "Der Tab Kontakte speichert Personen und Telefonnummern, auf Wunsch jeweils mit einer Kategorie verknüpft. Steht in einer Notiz oder einem Eintrag eine Nummer, bietet die App an, sie hinzuzufügen. Das Adressbuch deines Telefons liest sie nie.", "Die Suche im Tab Agenden durchsucht jeden Tag aller Agenden. Notizen und Kontakte haben eine eigene Suche.", "Gelöschte Agenden, Aufgaben, Fotos, Notizen und Kontakte warten im Papierkorb, bis du sie wiederherstellst oder endgültig löschst. In den Einstellungen kannst du ein Backup exportieren und später importieren.", "Das Menüsymbol öffnet ein Seitenfenster. In den Einstellungen findest du die Themenleiste, die Sprache und das Backup. Diese Symbole bedeuten:"], "n": "Weiter", "s": "Überspringen", "g": "Los geht’s", "h": "Einführung"},
    ja: {"t": ["あなたの手帳", "1日1ページ", "書く、チェック、覚える", "瞬間を残す", "クイックメモ", "連絡先", "何でも見つかる", "何も失われない", "すべてメニューに"], "d": ["「仕事」「家」など、名前とアイコンを付けた手帳を好きなだけ作れます。年を選ぶことも、年なしにすることもできます。手帳を長押しすると編集や削除ができます。", "日をタップするとそのページが開きます。月表示で横にスワイプすると月が変わり、「今日」で戻れます。日付の下の点は項目の数を表します。", "タスクを追加し、必要なら時刻やリマインダーを設定して、丸をタップして完了にします。項目の横の矢印で詳しい説明欄が開きます。項目を長押しすると削除できます。", "どの項目にも写真を1枚添付できます。写真はこの端末の中だけに保存されます。開いてスマホを傾けると3Dで傾き、すべての写真は月ごとに「思い出」で見られます。", "「メモ」タブはすばやい思いつき用：+ をタップして書くだけ。1行目がタイトルになります。大事なものはピン留め、検索、好きな日のタスクへの変換もできます。", "「連絡先」タブには人と電話番号を保存でき、カテゴリに関連付けることもできます。メモや項目に電話番号があると、追加するか尋ねます。端末のアドレス帳は読み取りません。", "「手帳」タブの検索ボックスは、すべての手帳のすべての日を検索します。メモと連絡先にはそれぞれ検索があります。", "削除した手帳、タスク、写真、メモ、連絡先は、復元するか完全に削除するまでゴミ箱で待機します。設定でバックアップを書き出し、あとで読み込めます。", "メニューのアイコンでサイドパネルが開きます。設定にはテーマの帯、言語、バックアップがあります。アイコンの意味："], "n": "次へ", "s": "スキップ", "g": "はじめる", "h": "チュートリアル"},
    ko: {"t": ["나의 다이어리", "하루에 한 페이지", "쓰고, 체크하고, 기억하기", "순간을 간직하기", "빠른 메모", "연락처", "무엇이든 찾기", "잃어버리는 건 없어요", "모두 메뉴에"], "d": ["“업무”, “집”처럼 이름과 아이콘이 있는 다이어리를 원하는 만큼 만들 수 있어요. 연도를 고르거나 연도 없이 둘 수 있어요. 다이어리를 길게 누르면 편집하거나 삭제할 수 있어요.", "날짜를 눌러 그날의 페이지를 열어요. 월 보기에서 옆으로 밀어 달을 바꾸고, 오늘 버튼으로 돌아와요. 날짜 아래 점은 항목 수를 보여 줘요.", "할 일을 추가하고, 원하면 시간이나 알림을 정한 뒤 동그라미를 눌러 완료해요. 항목 옆 화살표는 더 긴 설명란을 열어 줘요. 항목을 길게 누르면 삭제돼요.", "항목마다 사진을 한 장 붙일 수 있어요. 사진은 이 기기에만 저장돼요. 사진을 열고 폰을 기울이면 3D로 기울어지고, 모든 사진은 월별로 추억에서 볼 수 있어요.", "메모 탭은 빠른 생각을 위한 곳이에요. +를 누르고 바로 쓰세요. 첫 줄이 제목이 돼요. 중요한 메모는 고정하고, 검색하고, 원하는 날의 할 일로 바꿀 수 있어요.", "연락처 탭에는 사람과 전화번호를 저장하고, 원하면 카테고리와 연결할 수 있어요. 메모나 항목에 전화번호가 있으면 추가할지 물어봐요. 휴대폰의 주소록은 읽지 않아요.", "다이어리 탭의 검색창은 모든 다이어리의 모든 날을 찾아봐요. 메모와 연락처에는 각자의 검색이 있어요.", "삭제한 다이어리, 할 일, 사진, 메모, 연락처는 복원하거나 완전히 삭제할 때까지 휴지통에 있어요. 설정에서 백업 파일을 내보내고 나중에 가져올 수 있어요.", "메뉴 아이콘을 누르면 사이드 패널이 열려요. 설정에는 테마 띠, 언어, 백업이 있어요. 아이콘의 뜻은 이래요:"], "n": "다음", "s": "건너뛰기", "g": "시작하기", "h": "사용법"},
    it: {"t": ["Le tue agende", "Una pagina al giorno", "Scrivi, spunta, ricorda", "Conserva il momento", "Note rapide", "Contatti", "Trova tutto", "Niente va perso", "Tutto nel menu"], "d": ["Crea quante agende vuoi, ognuna con nome e icona, come Lavoro o Casa. Scegli un anno o lasciala senza anno. Tieni premuta un’agenda per modificarla o eliminarla.", "Tocca un giorno per aprire la sua pagina. Scorri di lato nella griglia del mese per cambiare mese e usa Oggi per tornare. I puntini sotto un giorno indicano quante voci ha.", "Aggiungi un’attività, imposta un orario o un promemoria se vuoi e tocca il cerchio per spuntarla. La freccia accanto a una voce apre una descrizione più lunga. Tieni premuta una voce per eliminarla.", "Allega una foto a qualsiasi voce. Le foto restano solo su questo dispositivo. Aprine una e inclina il telefono per vederla in 3D; le trovi tutte per mese in Ricordi.", "La scheda Note è per i pensieri veloci: tocca + e scrivi. La prima riga diventa il titolo. Fissa quelle importanti, cercale o trasforma una nota in attività di un giorno qualsiasi.", "La scheda Contatti conserva persone e numeri di telefono, ciascuno con una categoria se vuoi. Se una nota o una voce contiene un numero, l’app propone di aggiungerlo. Non legge mai la rubrica del tuo telefono.", "La ricerca nella scheda Agende scorre ogni giorno di tutte le agende. Note e Contatti hanno la propria ricerca.", "Agende, attività, foto, note e contatti eliminati restano nel Cestino finché non li ripristini o li elimini per sempre. Nelle Impostazioni puoi esportare un backup e importarlo più tardi.", "L’icona del menu apre un pannello laterale. Nelle Impostazioni trovi la striscia dei temi, la lingua e il backup. Queste icone significano:"], "n": "Avanti", "s": "Salta", "g": "Inizia", "h": "Tutorial"},
    nl: {"t": ["Je agenda’s", "Eén pagina per dag", "Schrijf, vink af, onthoud", "Bewaar het moment", "Snelle notities", "Contacten", "Vind alles", "Niets gaat verloren", "Alles in het menu"], "d": ["Maak zoveel agenda’s als je wilt, elk met een naam en een pictogram, zoals Werk of Thuis. Kies een jaar of laat het open. Houd een agenda ingedrukt om hem te bewerken of te verwijderen.", "Tik op een dag om de pagina te openen. Veeg zijwaarts in het maandraster om van maand te wisselen en gebruik Vandaag om terug te springen. Stipjes onder een dag tonen hoeveel items hij heeft.", "Voeg een taak toe, stel desgewenst een tijd of herinnering in en tik op het rondje om af te vinken. De pijl naast een item opent een langere beschrijving. Houd een item ingedrukt om het te verwijderen.", "Voeg aan elk item één foto toe. Foto’s blijven alleen op dit apparaat. Open er een en kantel je telefoon voor een 3D-effect; alle foto’s staan per maand bij Herinneringen.", "Het tabblad Notities is voor snelle gedachten: tik op + en schrijf. De eerste regel wordt de titel. Zet belangrijke vast, zoek erin of maak van een notitie een taak op een willekeurige dag.", "Het tabblad Contacten bewaart personen en telefoonnummers, desgewenst gekoppeld aan een categorie. Staat er een nummer in een notitie of item, dan biedt de app aan het toe te voegen. Het adresboek van je telefoon leest ze nooit.", "De zoekbalk op het tabblad Agenda’s doorzoekt elke dag van alle agenda’s. Notities en Contacten hebben hun eigen zoekfunctie.", "Verwijderde agenda’s, taken, foto’s, notities en contacten wachten in de Prullenbak tot je ze herstelt of definitief verwijdert. In Instellingen kun je een back-up exporteren en later importeren.", "Het menupictogram opent een zijpaneel. In Instellingen vind je de themastrook, de taal en de back-up. Deze pictogrammen betekenen:"], "n": "Volgende", "s": "Overslaan", "g": "Beginnen", "h": "Uitleg"}
  };
  let tutEl = null;

  /* tanıtım: yeni sayfalar (+ menüsü, masaüstü) ve güncellenen metinler */
  const TUTX = {
    tr: { tb: "Sıra sende", td: "Ajandalar, Notlar ya da Kişiler sekmesine basılı tutup sürükle; istediğin sıraya bırak. Sıra bu cihazda hatırlanır.", bk: "Geri", pt: 'Artı düğmesi', pd: '+ düğmesine dokununca ekran hafifçe bulanıklaşır ve üç seçenek çıkar: yeni not, yeni kişi ya da fotoğraf. Fotoğraf seçersen, bugünün tarihli resimli bir not olur.', ph: 'Her girdiye ya da nota bir fotoğraf ekle (+ → Fotoğraf). Fotoğraflar yalnızca bu cihazda durur. Birini açıp telefonu eğerek 3B eğebilirsin; hepsi ay ay Anılar’da.', cd: 'Kişiler sekmesi kişileri telefon numarası, e-posta adresi ya da ikisiyle birlikte tutar; istersen her biri bir kategoriye bağlanır. Üstteki kısayollar Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 ve Yahoo’yu tarayıcında açar. Telefonunun rehberini okumaz.', d0t: 'Üç sütun', d0d: 'Ajandalar, notlar ve kişiler solda durur. Açık ajandanın ayı ortadadır. Tıkladığın günün sayfası sağda açılır. Ajanda değiştirince sayfa kayarak yenilenir.', d1t: 'Panelin', d1d: 'Hiçbir ajanda açık değilken sağ taraf panelindir: bugünün tarihi ve canlı bir saat (tıklayarak analog ile dijital arasında geç), yaklaşanlar, son hareketler ve bir bakışta ay. Ajandayı × ile kapat ya da soldaki “Ajanda” başlığına tıklayıp geri dön.', d2t: 'Yanda gün sayfası', d2d: 'Bir güne tıkla; ay görünür kalırken günün sayfası sağa yerleşir. Girdileri orada ekle, işaretle, düzenle; oklarla günler arasında gez, Esc ile kapat.' },
    en: { tb: "Your order", td: "Press and hold Agendas, Notes or Contacts, then drag it where you like. The order is remembered on this device.", bk: "Back", pt: 'The + button', pd: 'Tap + and the screen softly blurs to offer three choices: a new note, a new contact, or a photo. Pick Photo and it becomes a note with a picture, dated today.', ph: 'Attach one photo to any entry or note (+ → Photo). Photos stay on this device only. Open one and tilt your phone to tilt it in 3D, and find them all by month under Memories.', cd: 'The Contacts tab keeps people with a phone number, an email address or both, each linked to a category if you wish. The shortcuts on top open Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 and Yahoo in your browser. It never reads your phone’s address book.', d0t: 'Three columns', d0d: 'Agendas, notes and contacts sit on the left. The month of the open agenda is in the middle. The day you click opens on the right. Switching agenda slides the page across.', d1t: 'Your dashboard', d1d: 'With no agenda open, the right side is your dashboard: today’s date with a live clock (click it to switch between analog and digital), what is coming up, recent activity and a month at a glance. Close an agenda with × or click the title on the left to return.', d2t: 'Day page on the side', d2d: 'Click a day and its page docks on the right while the month stays in view. Add, tick and edit entries right there, move between days with the arrows, and press Esc to close it.' },
    zh: { tb: "顺序由你定", td: "按住“日程”“笔记”或“联系人”标签并拖动到想要的位置。顺序会保存在此设备上。", bk: "返回", pt: '加号按钮', pd: '点按 + 后屏幕会轻轻模糊，并出现三个选项：新笔记、新联系人或照片。选择照片，就会生成一条带图片、日期为今天的笔记。', ph: '可为任意条目或笔记添加一张照片（+ → 照片）。照片只保存在本设备上。打开照片后倾斜手机可看到3D倾斜效果，所有照片按月份集中在“回忆”中。', cd: '“联系人”标签可保存电话号码、电子邮件地址或两者兼有，还可关联到某个类别。顶部的快捷入口会在浏览器中打开 Gmail、iCloud、Outlook（Hotmail、Live）、Microsoft 365 和 Yahoo。它不会读取你手机的通讯录。', d0t: '三栏布局', d0d: '日程、笔记和联系人在左侧，当前日程的月视图在中间，点击某一天后它的页面会在右侧打开。切换日程时页面会滑动刷新。', d1t: '你的主页', d1d: '没有打开日程时，右侧是你的主页：今天的日期和实时时钟（点击可在指针与数字之间切换）、即将到来的事项、最近动态和一目了然的月历。点 × 关闭日程，或点击左侧的标题返回。', d2t: '侧边日期页', d2d: '点击某一天，它的页面会停靠在右侧，月视图仍然可见。可在那里添加、勾选和编辑条目，用箭头在各天之间切换，按 Esc 关闭。' },
    es: { tb: "Tu orden", td: "Mantén pulsada la pestaña Agendas, Notas o Contactos y arrástrala donde quieras. El orden se recuerda en este dispositivo.", bk: "Atrás", pt: 'El botón +', pd: 'Al tocar +, la pantalla se difumina y ofrece tres opciones: nota nueva, contacto nuevo o foto. Si eliges foto, se crea una nota con imagen y la fecha de hoy.', ph: 'Adjunta una foto a cualquier entrada o nota (+ → Foto). Las fotos se quedan solo en este dispositivo. Abre una e inclina el móvil para verla en 3D; todas están por meses en Recuerdos.', cd: 'La pestaña Contactos guarda personas con teléfono, correo electrónico o ambos, y cada una puede ir en una categoría. Los accesos de arriba abren Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 y Yahoo en tu navegador. Nunca lee la agenda de tu teléfono.', d0t: 'Tres columnas', d0d: 'Agendas, notas y contactos están a la izquierda. El mes de la agenda abierta va en el centro. El día que pulsas se abre a la derecha. Al cambiar de agenda, la página se desliza.', d1t: 'Tu panel', d1d: 'Sin ninguna agenda abierta, la derecha es tu panel: la fecha de hoy con un reloj en vivo (haz clic para alternar entre analógico y digital), lo próximo, la actividad reciente y el mes de un vistazo. Cierra la agenda con × o haz clic en el título de la izquierda para volver.', d2t: 'Día en un lateral', d2d: 'Haz clic en un día y su página se acopla a la derecha mientras el mes sigue a la vista. Añade, marca y edita entradas allí mismo, muévete entre días con las flechas y cierra con Esc.' },
    fr: { tb: "À ton rythme", td: "Maintiens appuyé sur Agendas, Notes ou Contacts, puis fais glisser l’onglet où tu veux. L’ordre est mémorisé sur cet appareil.", bk: "Retour", pt: 'Le bouton +', pd: 'Touche + : l’écran se floute doucement et propose trois choix : une note, un contact ou une photo. Avec Photo, tu obtiens une note illustrée datée d’aujourd’hui.', ph: 'Joins une photo à une entrée ou à une note (+ → Photo). Les photos restent uniquement sur cet appareil. Ouvres-en une et incline ton téléphone pour la voir en 3D ; toutes sont classées par mois dans Souvenirs.', cd: 'L’onglet Contacts garde des personnes avec un numéro de téléphone, une adresse e-mail ou les deux, chacune pouvant être liée à une catégorie. Les raccourcis du haut ouvrent Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 et Yahoo dans ton navigateur. Il ne lit jamais le répertoire de ton téléphone.', d0t: 'Trois colonnes', d0d: 'Les agendas, notes et contacts sont à gauche. Le mois de l’agenda ouvert est au centre. Le jour sur lequel tu cliques s’ouvre à droite. Quand tu changes d’agenda, la page glisse.', d1t: 'Ton tableau de bord', d1d: 'Sans agenda ouvert, la droite est ton tableau de bord : la date du jour avec une horloge en direct (clique pour passer de l’analogique au numérique), les prochaines échéances, l’activité récente et le mois d’un coup d’œil. Ferme l’agenda avec × ou clique sur le titre à gauche pour revenir.', d2t: 'Le jour sur le côté', d2d: 'Clique sur un jour : sa page se place à droite pendant que le mois reste visible. Ajoute, coche et modifie les entrées sur place, passe d’un jour à l’autre avec les flèches et ferme avec Échap.' },
    pt: { tb: "Sua ordem", td: "Mantenha pressionada a aba Agendas, Notas ou Contatos e arraste para onde quiser. A ordem fica salva neste dispositivo.", bk: "Voltar", pt: 'O botão +', pd: 'Ao tocar em +, a tela desfoca suavemente e mostra três opções: nova nota, novo contato ou foto. Se escolher Foto, cria uma nota com imagem e a data de hoje.', ph: 'Anexe uma foto a qualquer entrada ou nota (+ → Foto). As fotos ficam apenas neste dispositivo. Abra uma e incline o celular para vê-la em 3D; todas ficam por mês em Memórias.', cd: 'A aba Contatos guarda pessoas com número de telefone, endereço de e-mail ou os dois, cada uma ligada a uma categoria se quiser. Os atalhos no topo abrem Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 e Yahoo no navegador. Ela nunca lê a agenda do seu celular.', d0t: 'Três colunas', d0d: 'Agendas, notas e contatos ficam à esquerda. O mês da agenda aberta fica no meio. O dia em que você clica abre à direita. Ao trocar de agenda, a página desliza.', d1t: 'Seu painel', d1d: 'Sem nenhuma agenda aberta, o lado direito é o seu painel: a data de hoje com um relógio ao vivo (clique para alternar entre analógico e digital), os próximos compromissos, a atividade recente e o mês num relance. Feche a agenda com × ou clique no título à esquerda para voltar.', d2t: 'Dia ao lado', d2d: 'Clique em um dia e a página dele se encaixa à direita enquanto o mês continua visível. Adicione, marque e edite entradas ali mesmo, mude de dia com as setas e feche com Esc.' },
    ru: { tb: "Свой порядок", td: "Нажми и удерживай вкладку «Ежедневники», «Заметки» или «Контакты» и перетащи её куда хочешь. Порядок запоминается на этом устройстве.", bk: "Назад", pt: 'Кнопка +', pd: 'Нажми +: экран мягко размоется и предложит три варианта — новая заметка, новый контакт или фото. Если выберешь фото, получится заметка с картинкой и сегодняшней датой.', ph: 'Прикрепляй фото к любой записи или заметке (+ → Фото). Фото хранятся только на этом устройстве. Открой одно и наклони телефон — оно наклонится в 3D; все снимки по месяцам — в «Воспоминаниях».', cd: 'Во вкладке «Контакты» хранятся люди с номером телефона, адресом электронной почты или с обоими, каждого можно привязать к категории. Ярлыки сверху открывают Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 и Yahoo в браузере. Адресную книгу телефона приложение не читает.', d0t: 'Три колонки', d0d: 'Ежедневники, заметки и контакты — слева. Месяц открытого ежедневника — в центре. День, на который ты нажал, открывается справа. При смене ежедневника страница плавно сдвигается.', d1t: 'Твоя панель', d1d: 'Когда ни один ежедневник не открыт, справа — твоя панель: сегодняшняя дата и живые часы (нажми, чтобы переключить аналоговые и цифровые), ближайшие дела, недавние действия и месяц целиком. Закрой ежедневник кнопкой × или нажми на заголовок слева, чтобы вернуться.', d2t: 'День сбоку', d2d: 'Нажми на день — его страница встанет справа, а месяц останется на виду. Добавляй, отмечай и правь записи прямо там, переключай дни стрелками, закрывай клавишей Esc.' },
    de: { tb: "Deine Reihenfolge", td: "Halte Agenden, Notizen oder Kontakte gedrückt und ziehe den Tab an die gewünschte Stelle. Die Reihenfolge merkt sich dieses Gerät.", bk: "Zurück", pt: 'Der +-Knopf', pd: 'Tippst du auf +, wird der Bildschirm sanft unscharf und bietet drei Möglichkeiten: neue Notiz, neuer Kontakt oder Foto. Wählst du Foto, entsteht eine Notiz mit Bild und dem heutigen Datum.', ph: 'Hänge ein Foto an jeden Eintrag oder jede Notiz (+ → Foto). Fotos bleiben nur auf diesem Gerät. Öffne eins und neige dein Handy, dann neigt es sich in 3D; alle findest du nach Monaten unter Erinnerungen.', cd: 'Im Tab Kontakte stehen Personen mit Telefonnummer, E-Mail-Adresse oder beidem, auf Wunsch jeweils einer Kategorie zugeordnet. Die Kurzbefehle oben öffnen Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 und Yahoo im Browser. Das Adressbuch deines Telefons liest die App nie.', d0t: 'Drei Spalten', d0d: 'Agenden, Notizen und Kontakte stehen links, der Monat der geöffneten Agenda in der Mitte. Der Tag, den du anklickst, öffnet sich rechts. Beim Wechsel der Agenda gleitet die Seite herüber.', d1t: 'Dein Überblick', d1d: 'Ist keine Agenda offen, ist die rechte Seite dein Überblick: das heutige Datum mit Live-Uhr (anklicken, um zwischen analog und digital zu wechseln), Anstehendes, letzte Aktivität und der Monat auf einen Blick. Schließe die Agenda mit × oder klicke links auf den Titel, um zurückzukehren.', d2t: 'Tag an der Seite', d2d: 'Klicke auf einen Tag, und seine Seite dockt rechts an, während der Monat sichtbar bleibt. Trage dort Einträge ein, hake sie ab und bearbeite sie, wechsle mit den Pfeilen zwischen den Tagen und schließe mit Esc.' },
    ja: { tb: "並び順は自由に", td: "「手帳」「メモ」「連絡先」のタブを長押しして、好きな位置にドラッグします。並び順はこの端末に保存されます。", bk: "戻る", pt: '＋ボタン', pd: '＋をタップすると画面が軽くぼけて、新しいメモ・新しい連絡先・写真の3つが現れます。写真を選ぶと、今日の日付の写真付きメモになります。', ph: 'どのエントリーやメモにも写真を1枚添えられます（＋ → 写真）。写真はこの端末にだけ保存されます。開いてスマホを傾けると3Dで傾き、すべて月ごとに「思い出」にまとまります。', cd: '「連絡先」タブには、電話番号、メールアドレス、またはその両方を持つ人を保存でき、必要ならカテゴリーにも結び付けられます。上のショートカットから Gmail、iCloud、Outlook（Hotmail、Live）、Microsoft 365、Yahoo をブラウザで開けます。スマホのアドレス帳は読み取りません。', d0t: '3つの列', d0d: '手帳・メモ・連絡先は左、開いた手帳の月は中央に並びます。クリックした日のページは右に開きます。手帳を切り替えると、ページがスライドして入れ替わります。', d1t: 'ダッシュボード', d1d: '手帳を開いていないとき、右側はダッシュボードです。今日の日付とリアルタイムの時計（クリックでアナログとデジタルを切り替え）、近日の予定、最近の更新、ひと目で分かる月カレンダー。手帳は×で閉じるか、左のタイトルをクリックして戻れます。', d2t: '横に開く日のページ', d2d: '日をクリックすると、月を見たまま、その日のページが右側に表示されます。そこでエントリーを追加・チェック・編集でき、矢印で日を移動、Escで閉じられます。' },
    ko: { tb: "순서는 마음대로", td: "‘다이어리’, ‘메모’, ‘연락처’ 탭을 길게 누른 채 원하는 위치로 끌어다 놓으세요. 순서는 이 기기에 저장돼요.", bk: "뒤로", pt: '+ 버튼', pd: '+를 누르면 화면이 살짝 흐려지며 새 메모, 새 연락처, 사진 세 가지가 나타납니다. 사진을 고르면 오늘 날짜의 사진이 있는 메모가 만들어져요.', ph: '모든 항목이나 메모에 사진을 한 장 붙일 수 있어요(+ → 사진). 사진은 이 기기에만 저장됩니다. 사진을 열고 폰을 기울이면 3D로 기울어지고, 모든 사진은 월별로 ‘추억’에 모여요.', cd: '‘연락처’ 탭에는 전화번호, 이메일 주소 또는 둘 다 가진 사람을 저장하고, 원하면 카테고리에 연결할 수 있어요. 위의 바로가기로 Gmail, iCloud, Outlook(Hotmail, Live), Microsoft 365, Yahoo를 브라우저에서 열 수 있어요. 폰의 주소록은 읽지 않아요.', d0t: '세 개의 열', d0d: '다이어리, 메모, 연락처는 왼쪽에, 열린 다이어리의 월은 가운데에 있어요. 클릭한 날의 페이지는 오른쪽에 열려요. 다이어리를 바꾸면 페이지가 밀려 들어옵니다.', d1t: '나의 대시보드', d1d: '열린 다이어리가 없으면 오른쪽은 대시보드예요. 오늘 날짜와 실시간 시계(클릭하면 아날로그와 디지털 전환), 다가오는 일정, 최근 활동, 한눈에 보는 달력. ×로 다이어리를 닫거나 왼쪽 제목을 눌러 돌아오세요.', d2t: '옆에 열리는 하루', d2d: '날짜를 클릭하면 달력이 보이는 채로 그날의 페이지가 오른쪽에 붙어요. 거기서 항목을 추가·체크·수정하고, 화살표로 날짜를 이동하고, Esc로 닫아요.' },
    it: { tb: "Il tuo ordine", td: "Tieni premuto Agende, Note o Contatti e trascina la scheda dove vuoi. L’ordine viene ricordato su questo dispositivo.", bk: "Indietro", pt: 'Il pulsante +', pd: 'Tocca +: lo schermo si sfoca dolcemente e offre tre scelte: nuova nota, nuovo contatto o foto. Se scegli Foto, nasce una nota con immagine e la data di oggi.', ph: 'Allega una foto a qualsiasi voce o nota (+ → Foto). Le foto restano solo su questo dispositivo. Aprine una e inclina il telefono per vederla in 3D; le trovi tutte per mese in Ricordi.', cd: 'La scheda Contatti conserva persone con numero di telefono, indirizzo e-mail o entrambi, ognuna collegabile a una categoria. Le scorciatoie in alto aprono Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 e Yahoo nel browser. Non legge mai la rubrica del telefono.', d0t: 'Tre colonne', d0d: 'Agende, note e contatti stanno a sinistra. Il mese dell’agenda aperta è al centro. Il giorno su cui clicchi si apre a destra. Cambiando agenda, la pagina scorre.', d1t: 'La tua dashboard', d1d: 'Senza agende aperte, la destra è la tua dashboard: la data di oggi con un orologio in tempo reale (clicca per passare da analogico a digitale), le prossime scadenze, l’attività recente e il mese a colpo d’occhio. Chiudi l’agenda con × o clicca il titolo a sinistra per tornare.', d2t: 'Giorno di lato', d2d: 'Clicca un giorno e la sua pagina si aggancia a destra mentre il mese resta visibile. Aggiungi, spunta e modifica le voci lì, spostati tra i giorni con le frecce e chiudi con Esc.' },
    nl: { tb: "Jouw volgorde", td: "Houd Agenda’s, Notities of Contacten ingedrukt en sleep het tabblad waar je wilt. De volgorde wordt op dit apparaat onthouden.", bk: "Terug", pt: 'De +-knop', pd: 'Tik op + en het scherm wordt zacht wazig met drie keuzes: nieuwe notitie, nieuw contact of foto. Kies je Foto, dan ontstaat een notitie met een afbeelding en de datum van vandaag.', ph: 'Voeg een foto toe aan elk item of elke notitie (+ → Foto). Foto’s blijven alleen op dit apparaat. Open er een en kantel je telefoon om hem in 3D te kantelen; alles staat per maand onder Herinneringen.', cd: 'Het tabblad Contacten bewaart mensen met een telefoonnummer, een e-mailadres of allebei, desgewenst gekoppeld aan een categorie. De snelkoppelingen bovenaan openen Gmail, iCloud, Outlook (Hotmail, Live), Microsoft 365 en Yahoo in je browser. Het adresboek van je telefoon wordt nooit gelezen.', d0t: 'Drie kolommen', d0d: 'Agenda’s, notities en contacten staan links. De maand van de geopende agenda staat in het midden. De dag waarop je klikt opent rechts. Wissel je van agenda, dan schuift de pagina mee.', d1t: 'Je dashboard', d1d: 'Zonder geopende agenda is de rechterkant je dashboard: de datum van vandaag met een live klok (klik om te wisselen tussen analoog en digitaal), wat eraan komt, recente activiteit en de maand in één oogopslag. Sluit de agenda met × of klik links op de titel om terug te keren.', d2t: 'Dag aan de zijkant', d2d: 'Klik op een dag en de pagina ervan dockt rechts aan terwijl de maand zichtbaar blijft. Voeg daar items toe, vink ze af en pas ze aan, wissel met de pijltjes van dag en sluit met Esc.' },
  };
